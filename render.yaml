services:
  - type: web
    name: pavani-portfolio-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pavani-portfolio-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000","http://127.0.0.1:3000"]'
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: '^https://.*\.(netlify|vercel)\.app$'

databases:
  - name: pavani-portfolio-db
    databaseName: pavani_portfolio
    user: pavani_portfolio
    plan: free
    region: singapore
